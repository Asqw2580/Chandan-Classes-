<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Education Point - Premium Login</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
overflow-x:hidden;
position:relative;

background:
linear-gradient(
135deg,
#020617 0%,
#0f172a 20%,
#172554 45%,
#2563eb 70%,
#020617 100%
);
}

/* GLOW EFFECT */

body::before{
content:"";
position:absolute;
width:500px;
height:500px;
background:rgba(59,130,246,0.25);
filter:blur(120px);
top:-120px;
left:-120px;
border-radius:50%;
}

body::after{
content:"";
position:absolute;
width:450px;
height:450px;
background:rgba(37,99,235,0.20);
filter:blur(120px);
bottom:-120px;
right:-100px;
border-radius:50%;
}

/* CONTAINER */

.container{
position:relative;
z-index:10;

width:100%;
max-width:430px;

background:rgba(255,255,255,0.08);

backdrop-filter:blur(18px);

border:1px solid rgba(255,255,255,0.12);

border-radius:35px;

padding:35px 28px;

box-shadow:
0 10px 40px rgba(0,0,0,0.5),
0 0 20px rgba(37,99,235,0.25);
}

/* LOGO */

.logo{
text-align:center;
margin-bottom:20px;
}

.logo h1{

font-size:52px;
font-weight:900;

line-height:1.1;

background:linear-gradient(
90deg,
#38bdf8 0%,
#2563eb 50%,
#ffffff 100%
);

-webkit-background-clip:text;
-webkit-text-fill-color:transparent;

}

/* SUBTITLE */

.subtitle{
text-align:center;
font-size:17px;
line-height:1.8;
color:#e5e7eb;
margin-bottom:30px;
}

/* INPUT */

.input-box{
margin-bottom:22px;
}

.input-box label{
display:block;
margin-bottom:10px;
font-size:15px;
font-weight:600;
color:white;
}

.input-box input{
width:100%;
padding:18px 20px;

border:none;
outline:none;

border-radius:22px;

background:rgba(255,255,255,0.10);

border:1px solid rgba(255,255,255,0.08);

font-size:16px;
color:white;

transition:0.3s;
}

.input-box input:focus{
border:1px solid #38bdf8;
box-shadow:0 0 15px rgba(56,189,248,0.35);
}

.input-box input::placeholder{
color:#d1d5db;
}

/* OPTIONS */

.options{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
gap:10px;
flex-wrap:wrap;
}

.remember{
display:flex;
align-items:center;
gap:8px;
font-size:14px;
color:#e5e7eb;
}

.remember input{
accent-color:#38bdf8;
}

.forgot{
color:#38bdf8;
font-size:14px;
font-weight:600;
cursor:pointer;
}

/* BUTTONS */

.login-btn,
.otp-btn{
width:100%;
padding:18px;

border:none;
border-radius:24px;

font-size:18px;
font-weight:700;

cursor:pointer;

color:white;

margin-top:12px;

transition:0.3s;
}

.login-btn{
background:linear-gradient(
to right,
#2563eb,
#38bdf8
);
}

.otp-btn{
background:rgba(255,255,255,0.10);
border:1px solid rgba(255,255,255,0.08);
}

.login-btn:hover,
.otp-btn:hover{
transform:translateY(-3px);
}

/* DIVIDER */

.divider{
display:flex;
align-items:center;
text-align:center;
margin:25px 0;
color:#cbd5e1;
font-size:14px;
}

.divider::before,
.divider::after{
content:"";
flex:1;
border-bottom:1px solid rgba(255,255,255,0.15);
}

.divider::before{
margin-right:10px;
}

.divider::after{
margin-left:10px;
}

/* ADMIN BUTTON */

.admin-btn{
width:100%;
padding:16px;

border:none;
border-radius:22px;

background:rgba(255,255,255,0.10);

border:1px solid rgba(255,255,255,0.08);

color:white;

font-size:17px;
font-weight:700;

cursor:pointer;

transition:0.3s;
}

.admin-btn:hover{
background:rgba(255,255,255,0.18);
transform:translateY(-3px);
}

/* REGISTER */

.register-text{
margin-top:28px;

display:flex;
justify-content:center;
align-items:center;
gap:6px;

flex-wrap:wrap;

text-align:center;

font-size:15px;
font-weight:500;

color:#e5e7eb;
}

.register-text a{
color:#38bdf8;
text-decoration:none;
font-weight:700;
}

.register-text a:hover{
text-decoration:underline;
}

/* FOOTER */

.footer{
margin-top:20px;
text-align:center;
font-size:13px;
line-height:1.7;
color:#cbd5e1;
}

/* FORGOT PASSWORD POPUP */

.forgot-popup{
position:fixed;
top:0;
left:0;

width:100%;
height:100%;

background:rgba(0,0,0,0.7);

display:none;

justify-content:center;
align-items:center;

z-index:999;
}

.forgot-box{
width:90%;
max-width:360px;

background:#0f172a;

padding:25px;

border-radius:25px;

border:1px solid rgba(255,255,255,0.08);
}

.forgot-box h2{
text-align:center;
color:white;
margin-bottom:20px;
}

.forgot-box input{
width:100%;
padding:15px;

margin-bottom:15px;

border:none;
outline:none;

border-radius:16px;

background:rgba(255,255,255,0.08);

color:white;
}

.forgot-box button{
width:100%;
padding:15px;

border:none;
border-radius:18px;

font-size:15px;
font-weight:700;

cursor:pointer;

margin-bottom:12px;

background:linear-gradient(
to right,
#2563eb,
#38bdf8
);

color:white;
}

.close-btn{
background:#ef4444 !important;
}

/* MOBILE */

@media(max-width:480px){

.logo h1{
font-size:44px;
}

.subtitle{
font-size:15px;
}

.login-btn,
.otp-btn{
font-size:17px;
}

}

</style>

</head>

<body>

<div class="container">

<div class="logo">
<h1>Education Point</h1>
</div>

<div class="subtitle">
Welcome Back 👋<br>
Login Securely To Continue Learning
</div>

<form id="loginForm">

<div class="input-box">

<label>Email or Mobile Number</label>

<input 
type="text"
id="email"
placeholder="Enter email or mobile number"
required
>

</div>

<div class="input-box">

<label>Password</label>

<input 
type="password"
id="password"
placeholder="Enter password"
required
>

</div>

<div class="options">

<label class="remember">

<input type="checkbox">

Remember Password

</label>

<span class="forgot" onclick="openForgotBox()">
Forgot Password?
</span>

</div>

<button 
type="submit"
class="login-btn"
>

Login Securely 🚀

</button>

<button 
type="button"
class="otp-btn"
onclick="sendLoginOTP()"
>

Send Login OTP 📩

</button>

<button 
type="button"
class="login-btn"
onclick="verifyLoginOTP()"
>

Login With OTP 🔓

</button>

</form>

<div class="divider">
OR
</div>

<button 
type="button"
class="admin-btn"
onclick="window.location.href='admin-login.html'"
>

🔐 Login As Admin

</button>

<div class="register-text">

<span>Don't have an account?</span>

<a href="register.html">
Create Account
</a>

</div>

<div class="footer">
Education Point Premium Secure UI ✨
</div>

</div>

<!-- FORGOT PASSWORD POPUP -->

<div class="forgot-popup" id="forgotPopup">

<div class="forgot-box">

<h2>Reset Password 🔐</h2>

<input 
type="text"
id="forgotUser"
placeholder="Enter Email or Mobile"
>

<button 
type="button"
onclick="sendForgotOTP()"
>

Send OTP 📩

</button>

<input 
type="number"
id="forgotOTPInput"
placeholder="Enter OTP"
>

<input 
type="password"
id="newPassword"
placeholder="Enter New Password"
>

<button 
type="button"
onclick="verifyForgotOTP()"
>

Verify & Reset ✅

</button>

<button 
type="button"
class="close-btn"
onclick="closeForgotBox()"
>

Close ❌

</button>

</div>

</div>

<script>

/* NORMAL LOGIN */

document.getElementById("loginForm").addEventListener("submit",function(e){

e.preventDefault();

let email = document.getElementById("email").value;

let password = document.getElementById("password").value;

if(email === "" || password === ""){

alert("Please fill all fields ❌");

return;

}

alert("Login Successful ✅");

window.location.href = "student-dashboard.html";

});

/* OTP LOGIN */

let loginOTP = "";

function sendLoginOTP(){

let email = document.getElementById("email").value;

if(email === ""){

alert("Enter Email or Mobile First ❌");

return;

}

loginOTP = Math.floor(100000 + Math.random() * 900000);

alert("OTP Sent ✅\nDemo OTP: " + loginOTP);

}

function verifyLoginOTP(){

let userOTP = prompt("Enter Login OTP");

if(userOTP == loginOTP){

alert("OTP Login Successful ✅");

window.location.href = "student-dashboard.html";

}else{

alert("Wrong OTP ❌");

}

}

/* FORGOT PASSWORD */

let forgotOTP = "";

function openForgotBox(){

document.getElementById("forgotPopup").style.display = "flex";

}

function closeForgotBox(){

document.getElementById("forgotPopup").style.display = "none";

}

function sendForgotOTP(){

let user = document.getElementById("forgotUser").value;

if(user === ""){

alert("Please Enter Email or Mobile ❌");

return;

}

forgotOTP = Math.floor(100000 + Math.random() * 900000);

alert("OTP Sent Successfully ✅\nDemo OTP: " + forgotOTP);

}

function verifyForgotOTP(){

let userOTP = document.getElementById("forgotOTPInput").value;

let newPass = document.getElementById("newPassword").value;

if(userOTP == forgotOTP){

if(newPass === ""){

alert("Enter New Password ❌");

return;

}

alert("Password Reset Successful ✅");

closeForgotBox();

}else{

alert("Invalid OTP ❌");

}

}

</script>

</body>
</html>
